# 由「插件 → GitHub → Actions 构建 → garden-build 分支」驱动
# 服务器侧 garden-sync.timer 每分钟检查 garden-build 分支并拉取 dist 产物
name: Build garden

on:
  push:
    branches: [main]
    # 只在这些路径变化时重建，避免误触发
    paths:
      - "src/site/notes/**"
      - "src/site/img/**"
      - "src/site/**"
      - ".env"
      - "package.json"
      - "package-lock.json"
      - ".eleventy.js"
      - ".github/workflows/garden.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }
          echo "页面数: $(find dist -name '*.html' | wc -l)"
          du -sh dist

      - name: Publish dist to garden-build branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b garden-build
          git config user.name  "garden-bot"
          git config user.email "garden-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            garden-build
          echo "已推送到 garden-build 分支"
